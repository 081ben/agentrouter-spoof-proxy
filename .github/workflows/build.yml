name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: go build -o agentrouter-proxy.exe ./cmd/proxy

      - uses: actions/upload-artifact@v4
        with:
          name: agentrouter-proxy-windows
          path: agentrouter-proxy.exe
          retention-days: 30
